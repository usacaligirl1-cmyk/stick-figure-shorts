name: Auto Render Shorts (Fast)

on:
  push:
    paths:
      - 'scenes/**'
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Path to script (e.g. scenes/wall_story.py)'
        required: true
        default: 'scenes/wall_story.py'

env:
  # Blender scenes are split into this many slices, rendered on parallel runners.
  BLENDER_CHUNKS: 6

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      script: ${{ steps.detect.outputs.script }}
      engine: ${{ steps.detect.outputs.engine }}
      chunks: ${{ steps.detect.outputs.chunks }}
      chunk_count: ${{ steps.detect.outputs.chunk_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the pushed commits can be compared with what came before.
          fetch-depth: 0

      - name: Detect scene script and engine
        id: detect
        env:
          REQUESTED: ${{ github.event.inputs.script_path }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$REQUESTED" ]; then
            SCRIPT="$REQUESTED"
          else
            # Compare against the commit the branch pointed at before this push.
            # A brand-new branch has no such commit, so fall back to the parent.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || true)
            fi
            SCRIPT=""
            if [ -n "$BEFORE" ]; then
              SCRIPT=$(git diff --name-only --diff-filter=AMR "$BEFORE" HEAD -- 'scenes/*.py' | head -n 1)
            fi
          fi
          [ -z "$SCRIPT" ] && SCRIPT="scenes/wall_story.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi
          echo "Detected script: $SCRIPT"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

          if grep -q "import bpy" "$SCRIPT"; then
            echo "engine=blender" >> "$GITHUB_OUTPUT"
          else
            echo "engine=manim" >> "$GITHUB_OUTPUT"
          fi

          # Only scripts that understand SHORTS_CHUNK can be split; others render in one piece.
          if grep -q "SHORTS_CHUNK" "$SCRIPT"; then
            COUNT="$BLENDER_CHUNKS"
          else
            COUNT=1
          fi
          echo "chunk_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "chunks=[$(seq -s, 1 "$COUNT")]" >> "$GITHUB_OUTPUT"

  render-manim:
    needs: detect
    if: needs.detect.outputs.engine == 'manim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Manim (no LaTeX)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu
          pip install -q manim

      - name: Render 1080x1920 Video
        env:
          SCRIPT: ${{ needs.detect.outputs.script }}
        run: |
          set -euo pipefail
          mkdir -p output temp
          BASENAME=$(basename "$SCRIPT" .py)
          SCENE_CLASS=$(grep -E "^class [A-Za-z_0-9]+\(.*Scene\):" "$SCRIPT" | head -n 1 | sed -E 's/class ([^\(]+)\(.*/\1/' || true)
          if [ -z "$SCENE_CLASS" ]; then
            echo "::error::No Scene class found in $SCRIPT"
            exit 1
          fi
          manim -qh --resolution 1080,1920 --fps 60 --media_dir temp "$SCRIPT" "$SCENE_CLASS"
          FOUND_MP4=$(find temp/videos -name "${SCENE_CLASS}.mp4" | head -n 1)
          cp "$FOUND_MP4" "output/${BASENAME}.mp4"
          test -s "output/${BASENAME}.mp4"

      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14

  render-blender:
    needs: detect
    if: needs.detect.outputs.engine == 'blender'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJson(needs.detect.outputs.chunks) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          # xvfb + Mesa give Eevee the OpenGL display it needs on a GPU-less runner.
          sudo apt-get update -qq
          # ffmpeg: split-screen scenes stack their two panels with it.
          sudo apt-get install -y -qq xvfb libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 fonts-dejavu ffmpeg
          # Pinned to 4.1.1: the last release with the original Eevee, which is much faster
          # on a GPU-less runner than the 4.2+ rewrite and still has bloom.
          wget -q https://download.blender.org/release/Blender4.1/blender-4.1.1-linux-x64.tar.xz
          tar -xf blender-4.1.1-linux-x64.tar.xz
          sudo mv blender-4.1.1-linux-x64 /opt/blender
          sudo ln -s /opt/blender/blender /usr/local/bin/blender
          blender --version | head -n 1

      - name: Render slice ${{ matrix.chunk }} of ${{ needs.detect.outputs.chunk_count }}
        env:
          SCRIPT: ${{ needs.detect.outputs.script }}
          SHORTS_CHUNK: ${{ matrix.chunk }}/${{ needs.detect.outputs.chunk_count }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          mkdir -p parts
          PART="parts/part_$(printf %02d "$CHUNK").mp4"
          xvfb-run -a blender -b -P "$SCRIPT" -- "$PART"
          test -s "$PART"

      - name: Upload slice
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: parts/*.mp4
          retention-days: 1

  stitch-blender:
    needs: [detect, render-blender]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download slices
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true

      - name: Join slices into one video
        env:
          SCRIPT: ${{ needs.detect.outputs.script }}
          EXPECTED: ${{ needs.detect.outputs.chunk_count }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          BASENAME=$(basename "$SCRIPT" .py)
          mkdir -p output
          ls -la parts
          FOUND=$(ls parts/part_*.mp4 | wc -l)
          if [ "$FOUND" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED slices, found $FOUND"
            exit 1
          fi
          # Zero-padded names sort in frame order; copy the streams without re-encoding.
          for f in $(ls parts/part_*.mp4 | sort); do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy "output/${BASENAME}.mp4"
          ffprobe -v error -count_frames -show_entries stream=width,height,r_frame_rate,nb_read_frames,duration -of default=nw=1 "output/${BASENAME}.mp4"
          test -s "output/${BASENAME}.mp4"

      - name: Upload Rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14
